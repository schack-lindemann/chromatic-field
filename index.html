<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Chromatic Field</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #06070a;
    color: #e8e9ee;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    user-select: none;
    overflow: hidden;
  }
  h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.35em; text-transform: uppercase; color: #9aa0ae; margin-bottom: 6px; }
  .sub { font-size: 12px; color: #5c6270; margin-bottom: 40px; }
  .disc {
    width: 170px; height: 170px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.4s ease;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 60%, transparent 75%);
    border: 1px solid rgba(255,255,255,0.12);
    margin-bottom: 34px;
  }
  .disc .note { font-size: 44px; font-weight: 200; line-height: 1; }
  .disc .hz { font-size: 11px; color: #8b93a5; margin-top: 8px; letter-spacing: 0.1em; }
  .disc .hint { font-size: 13px; color: #b9c0cf; padding: 0 22px; line-height: 1.5; }
  .disc.playing { animation: breathe 8s ease-in-out infinite; }
  .disc.playing .note { animation: glow 8s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 40px 4px var(--halo); transform: scale(1); }
    50% { box-shadow: 0 0 90px 18px var(--halo); transform: scale(1.05); }
  }
  @keyframes glow { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
  .btn {
    appearance: none; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.05); color: #dfe2ea;
    font-size: 14px; font-family: inherit;
    padding: 12px 22px; border-radius: 999px; margin: 6px; cursor: pointer;
  }
  .btn:active { background: rgba(255,255,255,0.14); }
  .status { font-size: 12px; color: #616778; margin-top: 26px; max-width: 300px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>Chromatic Field</h1>
  <div class="sub">a sound installation</div>

  <div class="disc" id="disc" role="button" tabindex="0" aria-label="Receive a sound" aria-pressed="false">
    <div class="hint" id="discHint">Tap to receive<br>your sound</div>
  </div>

  <div>
    <button class="btn" id="reroll" style="display:none">Receive another sound</button>
    <button class="btn" id="leave" style="display:none">Leave quietly</button>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

<script>
(function () {
  // ---- Note pool: Cmaj9 chord tones across two octaves (C4–D6). ----------
  // Chord tones only — C E G B D — so every visitor adds a consonant
  // voice. Kept above ~C4 because phone speakers roll off below ~300 Hz.
  const NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  const CHORD = [0, 4, 7, 11, 14, 16, 18, 19, 21, 23, 26];  // C4 E4 G4 B4 D5 · C5 E5 G5 F♯5 A5 B5 D6
  const POOL = CHORD.map(function (k) {
    return {
      freq: 261.6256 * Math.pow(2, k / 12),
      name: NAMES[k % 12] + (4 + Math.floor(k / 12)),
      hue: (k % 12) * 30
    };
  });

  const disc = document.getElementById("disc");
  const discHint = document.getElementById("discHint");
  const reroll = document.getElementById("reroll");
  const leave = document.getElementById("leave");
  const status = document.getElementById("status");

  let engine = null;
  let current = null;
  let wakeLock = null;

  // ---- WAV generation ----------------------------------------------------
  // One waveform function w(τ), exactly periodic over the 8-second loop D,
  // built so that w(0) = 0 (sines start at a zero crossing). The buffer is
  // N_CYCLES loop cycles with no fade-in — the tone starts immediately at
  // full voice. Every component (fundamental, beat, octave, LFO) wraps
  // phase-exactly at the 8-second boundary, so the native loop wrap of the
  // <audio> element is mathematically seamless: the seam step is smaller
  // than ordinary sample-to-sample waveform motion.
  const D_LOOP = 8, N_CYCLES = 24;
  function makeToneWav(freq) {
    const rate = 44100;
    const n = D_LOOP * N_CYCLES * rate;
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    const TWO = Math.PI * 2;
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true);
    v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);
    // Snap the frequency to a multiple of 1/D_LOOP and the detune to
    // 3/D_LOOP so the waveform is exactly periodic over D_LOOP. The pitch
    // shift is < 0.5 cent — imperceptible.
    const f0 = Math.round(freq * D_LOOP) / D_LOOP;
    const fb = f0 + 3 / D_LOOP;
    const wave = (tau) =>
        0.55 * Math.sin(TWO * f0 * tau)                // fundamental
      + 0.45 * Math.sin(TWO * fb * tau)                 // detuned unison → slow beating
      + 0.12 * Math.sin(TWO * f0 * 2 * tau);           // soft octave partial
    const lfo = (tau) => 0.85 + 0.15 * Math.sin(TWO * tau / D_LOOP);  // one cycle per loop → seamless
    // The waveform is exactly periodic over D_LOOP, so render one cycle and
    // memory-copy it for the rest — generation is near-instant even on a
    // slow phone.
    const cycle = new Int16Array(D_LOOP * rate);
    for (let i = 0; i < cycle.length; i++) {
      const s = lfo(i / rate) * wave(i / rate);
      cycle[i] = Math.max(-1, Math.min(1, s * 0.72)) * 32767;
    }
    const pcm = new Int16Array(buf, 44, n);
    for (let c = 0; c < N_CYCLES; c++) pcm.set(cycle, c * cycle.length);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  // ---- Audio engine ------------------------------------------------------
  // Primary route: a looping WAV in an <audio> element — what real visitors
  // get, because it registers as media playback (survives screen lock,
  // bypasses the iOS mute switch, appears on the lock screen).
  // Fallback: a live Web Audio synth, for restricted embeds (e.g. the
  // sandboxed preview iframe) where media-element playback is blocked.
  async function startEngine(note) {
    // Ask for a "playback" audio session where the API exists
    // (Audio Session API): keeps sound alive on iOS despite the mute switch.
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}

    let a, urls = [];
    try {
      a = new Audio();
      a.playsInline = true;
      a.setAttribute("playsinline", "");
      a.src = makeToneWav(note.freq);        // exactly periodic: native loop is seamless
      a.loop = true;
      urls.push(a.src);
      await a.play();
      // Safari (WebKit) does not honour `loop` on blob media and simply
      // stops at the end. On compliant browsers this `ended` never fires
      // (native loop takes over); on Safari it restarts playback from the
      // top. The waveform is exactly periodic over the buffer, so the
      // restart is seamless apart from the unavoidable platform gap.
      a.addEventListener("ended", function () {
        if (a.loop) {
          a.currentTime = 0;
          a.play().catch(function () {});
        }
      });
      return {
        type: "element",
        stop: function () { a.pause(); a.src = ""; urls.forEach(u => URL.revokeObjectURL(u)); }
      };
    } catch (err) {
      if (a) { a.src = ""; }
      urls.forEach(u => URL.revokeObjectURL(u));
    }

    // Fallback: the same sound, generated live with oscillators.
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") await ctx.resume();
    // Autoplay policy can block Web Audio too: a suspended context would
    // leave the page silently "playing". Treat that as a start failure.
    if (ctx.state !== "running") {
      try { ctx.close(); } catch (e) {}
      throw new Error("Web Audio blocked");
    }

    const master = ctx.createGain();
    master.gain.value = 0.43;                          // full voice immediately — no fade-in
    const lfo = ctx.createOscillator();
    const lfoDepth = ctx.createGain();
    lfo.frequency.value = 0.125;                   // one cycle per 8-second "loop"
    lfoDepth.gain.value = 0.075;                   // ≈ 15% breathing
    lfo.connect(lfoDepth).connect(master.gain);
    lfo.start();

    [[note.freq, 0.55], [note.freq + 0.375, 0.45], [note.freq * 2, 0.12]]
      .forEach(function (p) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.frequency.value = p[0];
        g.gain.value = p[1];
        o.connect(g).connect(master);
        o.start();
      });

    master.connect(ctx.destination);
    return {
      type: "webaudio",
      stop: function () { try { ctx.close(); } catch (e) {} }
    };
  }

  // ---- Note assignment ---------------------------------------------------
  // Rotate through the pool by arrival second instead of uniform random:
  // with few visitors, random assignment can stack several phones on one
  // note and leave the chord without a root. Rotation spreads consecutive
  // arrivals across the chord; a reroll in the same second steps to the
  // next note so "receive another sound" always changes the pitch.
  function pickNote(prev) {
    const idx = Math.floor(Date.now() / 1000) % POOL.length;
    if (prev && POOL[idx] === prev) return POOL[(idx + 1) % POOL.length];
    return POOL[idx];
  }

  async function start() {
    stop(false);
    current = pickNote(current);
    try {
      engine = await startEngine(current);
    } catch (e) {
      engine = null;
      render(false);
      status.textContent = "Audio could not start here — tap the circle again.";
      return;
    }

    // Show up on the lock screen; playback survives screen lock.
    if (engine.type === "element" && "mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Your sound · " + current.name,
          artist: "Chromatic Field",
          album: "hold the phone, walk, listen"
        });
      } catch (e) {}
    }

    render(true);
    requestWakeLock();
  }

  function stop(reset) {
    if (engine) { engine.stop(); engine = null; }
    releaseWakeLock();
    if (reset) render(false);
  }

  function render(playing) {
    disc.setAttribute("aria-pressed", playing ? "true" : "false");
    if (!playing) {
      disc.classList.remove("playing");
      disc.innerHTML = '<div class="hint" id="discHint">Tap to receive<br>your sound</div>';
      reroll.style.display = leave.style.display = "none";
      status.textContent = "";
      return;
    }
    disc.style.setProperty("--halo", "hsla(" + current.hue + ", 85%, 62%, 0.35)");
    disc.style.borderColor = "hsla(" + current.hue + ", 80%, 65%, 0.5)";
    disc.classList.add("playing");
    disc.innerHTML =
      '<div class="note" style="color:hsl(' + current.hue + ',85%,72%)">' + current.name + '</div>' +
      '<div class="hz">' + current.freq.toFixed(1) + ' Hz</div>';
    reroll.style.display = leave.style.display = "inline-block";
    status.innerHTML = "You are part of the piece.<br>Walk around — the room changes what you hear.<br>Use your volume buttons to set your loudness.";
  }

  // ---- Keep the screen on where supported (iOS 16.4+) -------------------
  async function requestWakeLock() {
    try {
      wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) { /* older devices: audio still loops after lock */ }
  }
  function releaseWakeLock() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && engine) requestWakeLock();
  });

  disc.addEventListener("click", () => { if (!engine) start(); });
  disc.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && !engine) {
      e.preventDefault();
      start();
    }
  });
  reroll.addEventListener("click", start);
  leave.addEventListener("click", () => stop(true));
})();
</script>
</body>
</html>
